apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mymanualgithub-app-ingress
  namespace: MANUALGITHUB-APP-NS
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
      - mymanualgithub.dev  # ← Remplacez par votre domaine
    secretName: salaka-tls
  rules:
  - host: mymanualgithub.dev  # ← Remplacez par votre domaine
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mymanualgithub-app-svc
            port:
              number: 80